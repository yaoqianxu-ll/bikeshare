spring:
  application:
    name: bikeshare
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bickdemo}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me-root-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCP-bickdemo
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  cache:
    type: redis

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-jwt-secret-with-at-least-32-bytes}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  expiration: 43200000

# 缓存配置
cache:
  expiration:
    bicycles: 600000
    statistics: 300000
    user: 1800000

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:change-me-minio-access-key}
  secretKey: ${MINIO_SECRET_KEY:change-me-minio-secret-key}
  bucket-name: ${MINIO_BUCKET:bicycles}

logging:
  level:
    com.example.bickdemo: INFO
    org.springframework.security: INFO
    org.springframework.aop.framework.CglibAopProxy: ERROR

# Actuator 配置（用于健康检查）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  gaode:
    map:
      api:
        key: ${GAODE_MAP_API_KEY:}
  redis:
    key-prefix: ${APP_REDIS_KEY_PREFIX:bickdemo:prod:}
  rental:
    range-check:
      # 线上继续强制要求可识别公网 IP，避免本地/内网绕过 10 公里范围限制。
      require-public-ip: ${APP_RENTAL_RANGE_REQUIRE_PUBLIC_IP:true}
      max-distance-km: ${APP_RENTAL_RANGE_MAX_DISTANCE_KM:10}
  security:
    ip-control:
      guest-max-requests-per-minute: ${APP_SECURITY_IP_GUEST_MAX_REQUESTS_PER_MINUTE:60}
      authenticated-max-requests-per-minute: ${APP_SECURITY_IP_AUTH_MAX_REQUESTS_PER_MINUTE:60}
      ban-duration-minutes: ${APP_SECURITY_IP_BAN_DURATION_MINUTES:15}
