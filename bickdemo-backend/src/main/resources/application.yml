spring:
  application:
    name: bikeshare
  main:
    # 保留 Spring Boot 启动信息，便于开发时观察应用启动过程。
    banner-mode: console
    log-startup-info: true
    # 本地开发优先提升“应用先起来”的速度，代价是首个请求会触发部分 Bean 的延迟初始化。
    lazy-initialization: true
  jmx:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bickdemo}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me-db-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池名称
      pool-name: HikariCP-bickdemo
      # 本地开发时不需要启动就预热太多数据库连接，避免启动阶段阻塞在连接池初始化上。
      minimum-idle: 1
      # 保留足够的并发能力，同时避免空闲期长期维护过多连接。
      maximum-pool-size: 10
      # 连接空闲超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接超时时间（毫秒）
      connection-timeout: 10000
      # 使用 JDBC4 的 isValid() 做存活检测，避免每次都额外执行测试 SQL。
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  cache:
    type: redis
  ai:
    openai:
      base-url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:Pro/deepseek-ai/DeepSeek-V3.2}
          temperature: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:0.7}


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 保留 MyBatis SQL 日志，但交给 Slf4j 输出，后续可以通过 logging.level 精细控制。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-jwt-secret-with-at-least-32-bytes}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  expiration: 43200000


# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:change-me-minio-access-key}
  secretKey: ${MINIO_SECRET_KEY:change-me-minio-secret-key}
  bucket-name: ${MINIO_BUCKET:bicycles}

logging:
  file:
    path: logs
  level:
    root: INFO
    # 本地默认按 INFO 输出应用日志，避免启动阶段的过滤器初始化与框架 DEBUG 噪音刷屏。
    com.example.bickdemo: INFO
    org.springframework.security: INFO
    # Bean 创建阶段真正刷屏的是 DEBUG，这里保留 INFO，去掉冗余的调试级输出。
    org.springframework.beans.factory.support: INFO
    org.springframework.boot.autoconfigure: INFO
    org.mybatis: INFO
    com.baomidou: INFO
    com.zaxxer.hikari: INFO
    # RabbitMQ 连接工厂被 AOP 代理时会输出无业务影响的告警，这里仅保留 ERROR。
    org.springframework.aop.framework.CglibAopProxy: ERROR

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from-name: ${MAIL_FROM_NAME:BikeShare}
    code-expire-minutes: 10
  # 高德地图 API 配置（用于根据经纬度反查地区信息）
  # 申请地址：https://lbs.amap.com/api/webservice/guide/api/georegeo
  gaode:
    map:
      api:
        key: ${GAODE_MAP_API_KEY:}
  redis:
    key-prefix: ${APP_REDIS_KEY_PREFIX:bickdemo:local:}
  rental:
    range-check:
      # 本地开发通常拿到的是 127.0.0.1 / 内网 IP，这里默认不强制要求公网定位，方便联调。
      require-public-ip: ${APP_RENTAL_RANGE_REQUIRE_PUBLIC_IP:false}
      max-distance-km: ${APP_RENTAL_RANGE_MAX_DISTANCE_KM:10}
  security:
    ip-control:
      guest-max-requests-per-minute: ${APP_SECURITY_IP_GUEST_MAX_REQUESTS_PER_MINUTE:60}
      authenticated-max-requests-per-minute: ${APP_SECURITY_IP_AUTH_MAX_REQUESTS_PER_MINUTE:60}
      ban-duration-minutes: ${APP_SECURITY_IP_BAN_DURATION_MINUTES:15}

# 图形验证码配置
captcha:
  length: 4
  width: 120
  height: 40
  font-size: 24
  session-key: captcha

# 支付宝配置
alipay:
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/vip/order/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/points}
  sandbox: ${ALIPAY_SANDBOX:true}

# VIP订单配置
vip-order:
  expire-minutes: 15
