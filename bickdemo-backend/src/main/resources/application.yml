spring:
  application:
    name: bickdemo
  main:
    # 保留 Spring Boot 启动信息，便于开发时观察应用启动过程。
    banner-mode: console
    log-startup-info: true
    # 本地开发优先提升“应用先起来”的速度，代价是首个请求会触发部分 Bean 的延迟初始化。
    lazy-initialization: true
  jmx:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bickdemo}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me-db-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池名称
      pool-name: HikariCP-bickdemo
      # 本地开发时不需要启动就预热太多数据库连接，避免启动阶段阻塞在连接池初始化上。
      minimum-idle: 1
      # 保留足够的并发能力，同时避免空闲期长期维护过多连接。
      maximum-pool-size: 10
      # 连接空闲超时时间（毫秒）
      idle-timeout: 300000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接超时时间（毫秒）
      connection-timeout: 10000
      # 使用 JDBC4 的 isValid() 做存活检测，避免每次都额外执行测试 SQL。
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  cache:
    type: redis


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 保留 MyBatis SQL 日志，但交给 Slf4j 输出，后续可以通过 logging.level 精细控制。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-jwt-secret-with-at-least-32-bytes}
  previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  expiration: 86400000


# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:change-me-minio-access-key}
  secretKey: ${MINIO_SECRET_KEY:change-me-minio-secret-key}
  bucket-name: ${MINIO_BUCKET:bicycles}

logging:
  file:
    path: logs
  level:
    root: INFO
    com.example.bickdemo: INFO
    org.springframework.security: INFO
    # Bean 创建阶段真正刷屏的是 DEBUG，这里保留 INFO，去掉冗余的调试级输出。
    org.springframework.beans.factory.support: INFO
    org.springframework.boot.autoconfigure: INFO
    org.mybatis: INFO
    com.baomidou: INFO
    com.zaxxer.hikari: INFO

app:
  mail:
    from-name: ${MAIL_FROM_NAME:BikeShare}
    code-expire-minutes: 10
  redis:
    key-prefix: ${APP_REDIS_KEY_PREFIX:bickdemo:local:}
  security:
    ip-control:
      guest-max-requests-per-minute: ${APP_SECURITY_IP_GUEST_MAX_REQUESTS_PER_MINUTE:120}
      authenticated-max-requests-per-minute: ${APP_SECURITY_IP_AUTH_MAX_REQUESTS_PER_MINUTE:240}
      ban-duration-minutes: ${APP_SECURITY_IP_BAN_DURATION_MINUTES:15}
