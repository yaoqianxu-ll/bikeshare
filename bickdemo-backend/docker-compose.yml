version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: bikeshare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Lile200623
      MYSQL_DATABASE: bickdemo
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pLile200623"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bikeshare-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=Lile200623
      - MINIO_ENDPOINT=http://124.221.113.208:9000
      - MINIO_ACCESS_KEY=Cg6huvLg5AuW8ShqQoAr
      - MINIO_SECRET_KEY=j8AoV6yOOUXVNPWVcIpJLuuZJidCeurCiBwg1c1z
      - MINIO_BUCKET=bicycles
      - JWT_SECRET=c2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tbWluaW11bS0yNTYtYml0cw==
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: always
    networks:
      - bikeshare-network

networks:
  bikeshare-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
