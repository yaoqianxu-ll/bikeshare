spring:
  application:
    name: bickdemo
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/bickdemo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Lile200623}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCP-bickdemo
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  rabbitmq:
    host: ${RABBITMQ_HOST:124.221.113.208}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:yaoqianxu}
    password: ${RABBITMQ_PASSWORD:Lile200623}
  data:
    redis:
      host: ${REDIS_HOST:124.221.113.208}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Lile200623}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  cache:
    type: redis

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

