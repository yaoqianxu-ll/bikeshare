<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="adminGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#863bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#47bfff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="16" cy="16" r="15" fill="url(#adminGradient)"/>

  <!-- 管理图标 - 仪表盘/图表 -->
  <g fill="white">
    <!-- 左柱状图 -->
    <rect x="7" y="14" width="4" height="10" rx="1"/>
    <!-- 中柱状图 -->
    <rect x="14" y="10" width="4" height="14" rx="1"/>
    <!-- 右柱状图 -->
    <rect x="21" y="16" width="4" height="8" rx="1"/>
  </g>
</svg>
