version: '3.8'

# 优化部署方案 Docker Compose 配置
# 支持子域名访问、自动备份、健康检查

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: bikeshare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bikeshare}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups/mysql:/backups
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb-buffer-pool-size=512M
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root-password}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: bikeshare-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis-password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./backups/redis:/backups
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ==================== RabbitMQ 消息队列 ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bikeshare-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-bikeshare}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-rabbitmq-password}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./backups/rabbitmq:/backups
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ==================== MinIO 对象存储 ====================
  minio:
    image: minio/minio:latest
    container_name: bikeshare-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./backups/minio:/backups
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ==================== Spring Boot 后端 ====================
  app:
    build:
      context: ../bickdemo-backend
      dockerfile: Dockerfile.simple
    container_name: bikeshare-app
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-bickdemo}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me-db-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change-me-redis-password}
      - "APP_REDIS_KEY_PREFIX=${APP_REDIS_KEY_PREFIX:-bikeshare:prod:}"
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-change-me-minio-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      - MINIO_BUCKET=${MINIO_BUCKET:-bicycles}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-bikeshare}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-change-me-rabbitmq-password}
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret-with-at-least-32-bytes}
      - JWT_PREVIOUS_SECRETS=${JWT_PREVIOUS_SECRETS:-}
      - MAIL_HOST=${MAIL_HOST:-smtp.qq.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BikeShare}
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./logs/app:/app/logs
      - ./backups/app:/app/backups
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: bikeshare-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== 用户端前端 ====================
  frontend:
    build:
      context: ../bickdemo-frontend
      dockerfile: Dockerfile.simple
    container_name: bikeshare-frontend
    volumes:
      - ./logs/frontend:/var/log/nginx
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M

  # ==================== 管理端前端 ====================
  admin:
    build:
      context: ../bickdemo-admin
      dockerfile: Dockerfile.simple
    container_name: bikeshare-admin
    volumes:
      - ./logs/admin:/var/log/nginx
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 128M

  # ==================== 自动备份服务 ====================
  backup:
    image: mysql:8.0
    container_name: bikeshare-backup
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups/auto:/backups
      - ./scripts/backup.sh:/backup.sh
      - mysql-data:/var/lib/mysql
    networks:
      - bikeshare-network
    depends_on:
      - mysql
    entrypoint: /backup.sh
    restart: unless-stopped

networks:
  bikeshare-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/mysql
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/redis
  rabbitmq-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/rabbitmq
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/minio
