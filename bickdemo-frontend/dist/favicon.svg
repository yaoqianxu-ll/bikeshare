<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="url(#bikeGradient)"/>

  <!-- 自行车图标 -->
  <g transform="translate(50, 55)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后轮 -->
    <circle cx="-20" cy="0" r="12" stroke-width="2.5"/>
    <!-- 前轮 -->
    <circle cx="20" cy="0" r="12" stroke-width="2.5"/>
    <!-- 车架 -->
    <path d="M -20 0 L -5 0 L 5 -15 L 20 0" stroke-width="2.5"/>
    <path d="M -5 0 L 5 10" stroke-width="2.5"/>
    <!-- 车把 -->
    <path d="M 5 -15 L 15 -20" stroke-width="2.5"/>
    <!-- 座椅 -->
    <path d="M -8 -2 L -12 -8" stroke-width="2.5"/>
  </g>
</svg>
