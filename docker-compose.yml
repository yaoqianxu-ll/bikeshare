services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Lile200623
      MYSQL_DATABASE: bickdemo
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pLile200623"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./bickdemo-backend
      dockerfile: Dockerfile.simple
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=Lile200623
      - MINIO_ENDPOINT=http://124.221.113.208:9000
      - MINIO_ACCESS_KEY=Cg6huvLg5AuW8ShqQoAr
      - MINIO_SECRET_KEY=j8AoV6yOOUXVNPWVcIpJLuuZJidCeurCiBwg1c1z
      - MINIO_BUCKET=bicycles
      - RABBITMQ_HOST=124.221.113.208
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=yaoqianxu
      - RABBITMQ_PASSWORD=Lile200623
      - REDIS_HOST=124.221.113.208
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Lile200623
      - "APP_REDIS_KEY_PREFIX=bickdemo:prod:"
      - JWT_SECRET=c2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tbWluaW11bS0yNTYtYml0cw==
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      - ./bickdemo-backend/target:/app/target
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./bickdemo-frontend
      dockerfile: Dockerfile.simple
    dns:
      - 183.60.83.19
      - 183.60.82.98
    ports:
      - "80:80"
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - app

  admin:
    build:
      context: ./bickdemo-admin
      dockerfile: Dockerfile.simple
    ports:
      - "3001:80"
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - app

networks:
  bikeshare-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
