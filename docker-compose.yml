services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bickdemo}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: always
    networks:
      - bikeshare-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root-password}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./bickdemo-backend
      dockerfile: Dockerfile.simple
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-bickdemo}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-me-db-password}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-change-me-minio-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-change-me-minio-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-bicycles}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-localhost}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - "APP_REDIS_KEY_PREFIX=${APP_REDIS_KEY_PREFIX:-bickdemo:prod:}"
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret-with-at-least-32-bytes}
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      - ./bickdemo-backend/target:/app/target
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./bickdemo-frontend
      dockerfile: Dockerfile.simple
    dns:
      - 183.60.83.19
      - 183.60.82.98
    ports:
      - "80:80"
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - app

  admin:
    build:
      context: ./bickdemo-admin
      dockerfile: Dockerfile.simple
    ports:
      - "3001:80"
    restart: always
    networks:
      - bikeshare-network
    depends_on:
      - app

networks:
  bikeshare-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
